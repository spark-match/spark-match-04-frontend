<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav mode="side" [opened]="true" class="app-sidenav">
    <mat-toolbar color="primary" class="sidenav-toolbar">
      <mat-icon>auto_awesome</mat-icon>
      <span class="brand" i18n="@@app.brand">Spark Match</span>
    </mat-toolbar>

    <mat-nav-list>
      @for (item of navItems; track item.path) {
        @if (!item.protected || auth.isAuthenticated()) {
          <a mat-list-item
             [routerLink]="item.path"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: item.path === '/' }">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="app-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="spacer"></span>
      @if (auth.isAuthenticated()) {
        <a mat-button routerLink="/profile">
          <mat-icon>account_circle</mat-icon>
          <span class="user-label" i18n="@@app.profile">Mi perfil</span>
        </a>
      } @else {
        <a mat-button routerLink="/auth/login" i18n="@@app.login">Iniciar sesión</a>
        <a mat-flat-button routerLink="/auth/register" i18n="@@app.register">Registrarse</a>
      }
    </mat-toolbar>

    <main class="app-main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
