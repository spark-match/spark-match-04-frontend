# Exclusiones de COBERTURA (no de analisis: estos archivos se siguen
# analizando por bugs, smells y vulnerabilidades).
#
# src/environments/*: objetos de configuracion literales, sin una sola rama ni
# funcion. Angular los intercambia en build time con `fileReplacements`, asi que
# un test sobre ellos verificaria que un objeto literal es igual a si mismo. Al
# agregar environment.cloud-dev.ts, Sonar los contaba como codigo nuevo con 0%
# y hundia la cobertura del quality gate.
#
# main.ts: bootstrap de Angular, sin logica propia.
sonar.coverage.exclusions=src/environments/**,src/main.ts
