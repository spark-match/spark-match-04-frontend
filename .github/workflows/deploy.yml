name: deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  deploy:
    name: deploy-${{ github.ref_name }}
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-frontend-deploy.yml@main
    with:
      environment-name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      gh-environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      aws-region: us-east-1
      role-arn: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
      working-directory: '.'
      build-script: 'build --configuration=production'
      node-version: '24'
      bucket-name: ${{ github.ref_name == 'main' && 'spark-match-frontend-prod' || 'spark-match-frontend-dev' }}
      distribution-id: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      source-dir: 'dist/spark-match-frontend'
      cache-control-hashed: 'public, max-age=31536000, immutable'
      cache-control-html: 'no-cache, no-store, must-revalidate'
      invalidation-paths: '/*'