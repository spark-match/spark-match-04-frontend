name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      # TODO Fase 5+: deploy a S3 + CloudFront
      - name: Deploy placeholder
        id: deploy
        run: |
          echo "::notice::Deploy to ${{ github.ref_name }} pending Fase 5 (Terraform + S3 + CloudFront)"
          echo "url=https://spark-match.example.com" >> $GITHUB_OUTPUT
